<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2137"/>
      <stop offset="100%" stop-color="#061525"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="moonGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Night sky -->
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="50" cy="30" r="1" fill="white" opacity="0.8"/>
  <circle cx="120" cy="55" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="200" cy="20" r="1" fill="white" opacity="0.9"/>
  <circle cx="280" cy="45" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="350" cy="15" r="1.1" fill="white" opacity="0.5"/>
  <circle cx="450" cy="35" r="0.9" fill="white" opacity="0.8"/>
  <circle cx="550" cy="25" r="1" fill="white" opacity="0.6"/>
  <circle cx="620" cy="50" r="1.2" fill="white" opacity="0.9"/>
  <circle cx="700" cy="18" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="760" cy="42" r="1" fill="white" opacity="0.6"/>
  <circle cx="160" cy="80" r="0.7" fill="white" opacity="0.5"/>
  <circle cx="400" cy="60" r="0.9" fill="white" opacity="0.7"/>
  <circle cx="580" cy="75" r="1" fill="white" opacity="0.6"/>

  <!-- Moon -->
  <circle cx="680" cy="60" r="22" fill="#fef3c7" opacity="0.9" filter="url(#moonGlow)"/>
  <circle cx="692" cy="55" r="18" fill="#1a1a2e" opacity="0.4"/>

  <!-- Moon reflection on water -->
  <ellipse cx="680" cy="250" rx="30" ry="80" fill="#fef3c7" opacity="0.08"/>

  <!-- Ocean -->
  <rect x="0" y="222" width="800" height="178" fill="url(#sea)"/>

  <!-- Ocean shimmer -->
  <path d="M 0 230 Q 40 227 80 230 Q 120 233 160 230 Q 200 227 240 230 Q 280 233 320 230 Q 360 227 400 230 Q 440 233 480 230 Q 520 227 560 230 Q 600 233 640 230 Q 680 227 720 230 Q 760 233 800 230" fill="none" stroke="#1e4a70" stroke-width="1.5" opacity="0.6"/>
  <path d="M 0 242 Q 50 239 100 242 Q 150 245 200 242 Q 250 239 300 242 Q 350 245 400 242 Q 450 239 500 242 Q 550 245 600 242 Q 650 239 700 242 Q 750 245 800 242" fill="none" stroke="#163855" stroke-width="1" opacity="0.4"/>

  <!-- Wake trail -->
  <path d="M 60 265 Q 150 260 240 258 Q 320 256 400 255" fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0.2"/>
  <path d="M 40 272 Q 150 267 260 264 Q 340 261 400 260" fill="none" stroke="#1d4ed8" stroke-width="2" opacity="0.15"/>

  <!-- === OIL TANKER === -->
  <!-- Hull (very long, low freeboard) -->
  <path d="M 60 248 L 740 248 L 762 260 L 748 282 L 52 282 L 38 268 Z" fill="url(#hull)" filter="url(#shadow)"/>

  <!-- Waterline stripe (orange/red for tanker) -->
  <rect x="58" y="244" width="682" height="7" fill="#d97706" rx="2"/>
  <rect x="58" y="251" width="682" height="3" fill="#b45309"/>

  <!-- Main deck (very long flat) -->
  <rect x="62" y="215" width="676" height="35" fill="#374151" rx="1"/>
  <rect x="62" y="215" width="676" height="4" fill="#4b5563"/>

  <!-- Pipe manifold line (tanker characteristic) -->
  <rect x="80" y="228" width="520" height="4" rx="2" fill="#6b7280"/>
  <rect x="80" y="232" width="520" height="2" rx="1" fill="#9ca3af" opacity="0.5"/>

  <!-- Pipe supports/valves -->
  <rect x="105" y="220" width="6" height="18" rx="1" fill="#9ca3af"/>
  <rect x="165" y="220" width="6" height="18" rx="1" fill="#9ca3af"/>
  <rect x="225" y="220" width="6" height="18" rx="1" fill="#9ca3af"/>
  <rect x="285" y="220" width="6" height="18" rx="1" fill="#9ca3af"/>
  <rect x="345" y="220" width="6" height="18" rx="1" fill="#9ca3af"/>
  <rect x="405" y="220" width="6" height="18" rx="1" fill="#9ca3af"/>
  <rect x="465" y="220" width="6" height="18" rx="1" fill="#9ca3af"/>
  <rect x="525" y="220" width="6" height="18" rx="1" fill="#9ca3af"/>

  <!-- Valve wheels -->
  <circle cx="108" cy="224" r="4" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="228" cy="224" r="4" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="348" cy="224" r="4" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="468" cy="224" r="4" fill="none" stroke="#d97706" stroke-width="1.5"/>

  <!-- Superstructure (AFT) -->
  <rect x="605" y="175" width="115" height="43" rx="3" fill="#4b5563"/>
  <rect x="605" y="175" width="115" height="5" fill="#6b7280"/>

  <!-- Bridge deck -->
  <rect x="612" y="155" width="100" height="22" rx="2" fill="#374151"/>
  <rect x="608" y="158" width="8" height="15" fill="#374151"/>
  <rect x="716" y="158" width="8" height="15" fill="#374151"/>

  <!-- Bridge windows (row) -->
  <rect x="620" y="160" width="10" height="8" rx="1.5" fill="#0ea5e9" opacity="0.7" stroke="#38bdf8" stroke-width="0.5"/>
  <rect x="635" y="160" width="10" height="8" rx="1.5" fill="#0ea5e9" opacity="0.7" stroke="#38bdf8" stroke-width="0.5"/>
  <rect x="650" y="160" width="10" height="8" rx="1.5" fill="#0ea5e9" opacity="0.7" stroke="#38bdf8" stroke-width="0.5"/>
  <rect x="665" y="160" width="10" height="8" rx="1.5" fill="#0ea5e9" opacity="0.7" stroke="#38bdf8" stroke-width="0.5"/>
  <rect x="680" y="160" width="10" height="8" rx="1.5" fill="#0ea5e9" opacity="0.7" stroke="#38bdf8" stroke-width="0.5"/>
  <rect x="695" y="160" width="10" height="8" rx="1.5" fill="#0ea5e9" opacity="0.7" stroke="#38bdf8" stroke-width="0.5"/>
  <rect x="710" y="160" width="8" height="8" rx="1.5" fill="#0ea5e9" opacity="0.7" stroke="#38bdf8" stroke-width="0.5"/>

  <!-- Funnel (orange/black) -->
  <rect x="650" y="120" width="32" height="40" rx="3" fill="#374151"/>
  <rect x="650" y="120" width="32" height="8" rx="2" fill="#d97706"/>
  <!-- Orange stripe on funnel -->
  <rect x="650" y="128" width="32" height="6" fill="#f59e0b"/>
  <!-- Smoke -->
  <ellipse cx="666" cy="113" rx="9" ry="6" fill="#6b7280" opacity="0.5"/>
  <ellipse cx="670" cy="100" rx="12" ry="8" fill="#9ca3af" opacity="0.35"/>
  <ellipse cx="675" cy="85" rx="16" ry="10" fill="#d1d5db" opacity="0.2"/>

  <!-- Mast forward -->
  <line x1="170" y1="215" x2="170" y2="165" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="155" y1="180" x2="185" y2="180" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="170" cy="165" r="3" fill="#374151"/>

  <!-- Navigation lights -->
  <circle cx="660" cy="154" r="3" fill="#fbbf24" opacity="0.95" filter="url(#moonGlow)"/>
  <circle cx="170" cy="163" r="2.5" fill="#ffffff" opacity="0.9"/>

  <!-- Port nav light (red) -->
  <circle cx="62" cy="250" r="3" fill="#ef4444" opacity="0.9" filter="url(#moonGlow)"/>

  <!-- Label -->
  <text x="350" y="272" text-anchor="middle" font-family="monospace" font-size="9" fill="#9ca3af" opacity="0.7">OIL TANKER</text>
</svg>
