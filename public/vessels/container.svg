<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#1a6fa8"/>
      <stop offset="100%" stop-color="#2596d1"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565a0"/>
      <stop offset="100%" stop-color="#0d3d70"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f1f3d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Sky - golden hour -->
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- Sun horizon glow -->
  <ellipse cx="120" cy="215" rx="200" ry="50" fill="#f59e0b" opacity="0.12"/>
  <ellipse cx="120" cy="218" rx="100" ry="25" fill="#fbbf24" opacity="0.18"/>

  <!-- Clouds -->
  <ellipse cx="200" cy="80" rx="70" ry="20" fill="#e0f2fe" opacity="0.12"/>
  <ellipse cx="160" cy="75" rx="45" ry="15" fill="#e0f2fe" opacity="0.1"/>
  <ellipse cx="580" cy="55" rx="80" ry="18" fill="#e0f2fe" opacity="0.1"/>
  <ellipse cx="630" cy="60" rx="50" ry="13" fill="#e0f2fe" opacity="0.08"/>

  <!-- Ocean -->
  <rect x="0" y="218" width="800" height="182" fill="url(#sea)"/>

  <!-- Waves -->
  <path d="M 0 228 Q 50 224 100 228 Q 150 232 200 228 Q 250 224 300 228 Q 350 232 400 228 Q 450 224 500 228 Q 550 232 600 228 Q 650 224 700 228 Q 750 232 800 228" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <path d="M 0 242 Q 60 238 120 242 Q 180 246 240 242 Q 300 238 360 242 Q 420 246 480 242 Q 540 238 600 242 Q 660 246 720 242 Q 760 238 800 242" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>
  <path d="M 0 258 Q 80 254 160 258 Q 240 262 320 258 Q 400 254 480 258 Q 560 262 640 258 Q 720 254 800 258" fill="none" stroke="#0284c7" stroke-width="1" opacity="0.25"/>

  <!-- Sun on water -->
  <rect x="60" y="225" width="120" height="60" fill="url(#sky)" opacity="0.15"/>
  <ellipse cx="120" cy="240" rx="18" ry="5" fill="#fbbf24" opacity="0.2"/>

  <!-- Wake -->
  <path d="M 60 265 Q 200 258 320 254 Q 380 252 420 250" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.25"/>
  <path d="M 40 275 Q 200 268 340 262 Q 400 260 430 258" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.18"/>

  <!-- === CONTAINER SHIP === -->
  <!-- Hull -->
  <path d="M 55 250 L 745 250 L 768 263 L 752 285 L 48 285 L 32 270 Z" fill="url(#hull)" filter="url(#shadow)"/>

  <!-- Boot-topping / waterline -->
  <rect x="53" y="246" width="692" height="7" fill="#0284c7" rx="1"/>
  <rect x="53" y="253" width="692" height="3" fill="#0369a1"/>

  <!-- Main deck -->
  <rect x="58" y="205" width="684" height="46" fill="#1e3a5f" rx="1"/>
  <rect x="58" y="205" width="684" height="4" fill="#2563eb" opacity="0.4"/>

  <!-- Container rows — bottom layer -->
  <!-- Row 1 (deck level) -->
  <rect x="70" y="215" width="48" height="24" rx="1" fill="#dc2626" stroke="#b91c1c" stroke-width="0.5"/>
  <rect x="122" y="215" width="48" height="24" rx="1" fill="#16a34a" stroke="#15803d" stroke-width="0.5"/>
  <rect x="174" y="215" width="48" height="24" rx="1" fill="#d97706" stroke="#b45309" stroke-width="0.5"/>
  <rect x="226" y="215" width="48" height="24" rx="1" fill="#2563eb" stroke="#1d4ed8" stroke-width="0.5"/>
  <rect x="278" y="215" width="48" height="24" rx="1" fill="#7c3aed" stroke="#6d28d9" stroke-width="0.5"/>
  <rect x="330" y="215" width="48" height="24" rx="1" fill="#dc2626" stroke="#b91c1c" stroke-width="0.5"/>
  <rect x="382" y="215" width="48" height="24" rx="1" fill="#16a34a" stroke="#15803d" stroke-width="0.5"/>
  <rect x="434" y="215" width="48" height="24" rx="1" fill="#0891b2" stroke="#0e7490" stroke-width="0.5"/>
  <rect x="486" y="215" width="48" height="24" rx="1" fill="#d97706" stroke="#b45309" stroke-width="0.5"/>
  <rect x="538" y="215" width="48" height="24" rx="1" fill="#dc2626" stroke="#b91c1c" stroke-width="0.5"/>

  <!-- Row 2 (second layer) -->
  <rect x="70" y="192" width="48" height="22" rx="1" fill="#0891b2" stroke="#0e7490" stroke-width="0.5"/>
  <rect x="122" y="192" width="48" height="22" rx="1" fill="#dc2626" stroke="#b91c1c" stroke-width="0.5"/>
  <rect x="174" y="192" width="48" height="22" rx="1" fill="#16a34a" stroke="#15803d" stroke-width="0.5"/>
  <rect x="226" y="192" width="48" height="22" rx="1" fill="#d97706" stroke="#b45309" stroke-width="0.5"/>
  <rect x="278" y="192" width="48" height="22" rx="1" fill="#374151" stroke="#4b5563" stroke-width="0.5"/>
  <rect x="330" y="192" width="48" height="22" rx="1" fill="#2563eb" stroke="#1d4ed8" stroke-width="0.5"/>
  <rect x="382" y="192" width="48" height="22" rx="1" fill="#dc2626" stroke="#b91c1c" stroke-width="0.5"/>
  <rect x="434" y="192" width="48" height="22" rx="1" fill="#16a34a" stroke="#15803d" stroke-width="0.5"/>
  <rect x="486" y="192" width="48" height="22" rx="1" fill="#7c3aed" stroke="#6d28d9" stroke-width="0.5"/>
  <rect x="538" y="192" width="48" height="22" rx="1" fill="#0891b2" stroke="#0e7490" stroke-width="0.5"/>

  <!-- Row 3 (third layer, partial) -->
  <rect x="70" y="170" width="48" height="21" rx="1" fill="#dc2626" stroke="#b91c1c" stroke-width="0.5"/>
  <rect x="122" y="170" width="48" height="21" rx="1" fill="#374151" stroke="#4b5563" stroke-width="0.5"/>
  <rect x="174" y="170" width="48" height="21" rx="1" fill="#d97706" stroke="#b45309" stroke-width="0.5"/>
  <rect x="226" y="170" width="48" height="21" rx="1" fill="#16a34a" stroke="#15803d" stroke-width="0.5"/>
  <rect x="278" y="170" width="48" height="21" rx="1" fill="#dc2626" stroke="#b91c1c" stroke-width="0.5"/>
  <rect x="382" y="170" width="48" height="21" rx="1" fill="#2563eb" stroke="#1d4ed8" stroke-width="0.5"/>
  <rect x="434" y="170" width="48" height="21" rx="1" fill="#d97706" stroke="#b45309" stroke-width="0.5"/>
  <rect x="486" y="170" width="48" height="21" rx="1" fill="#dc2626" stroke="#b91c1c" stroke-width="0.5"/>

  <!-- Container ridges (horizontal lines on containers) -->
  <line x1="70" y1="222" x2="118" y2="222" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  <line x1="122" y1="222" x2="170" y2="222" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  <line x1="226" y1="222" x2="274" y2="222" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>

  <!-- Superstructure (bridge island, middle) -->
  <rect x="600" y="168" width="105" height="40" rx="2" fill="#1e3a5f" stroke="#2563eb" stroke-width="0.5" opacity="0.8"/>
  <rect x="605" y="150" width="95" height="22" rx="2" fill="#1e3a5f"/>

  <!-- Bridge windows -->
  <rect x="613" y="155" width="11" height="8" rx="1.5" fill="#38bdf8" opacity="0.8" stroke="#7dd3fc" stroke-width="0.5"/>
  <rect x="629" y="155" width="11" height="8" rx="1.5" fill="#38bdf8" opacity="0.8" stroke="#7dd3fc" stroke-width="0.5"/>
  <rect x="645" y="155" width="11" height="8" rx="1.5" fill="#38bdf8" opacity="0.8" stroke="#7dd3fc" stroke-width="0.5"/>
  <rect x="661" y="155" width="11" height="8" rx="1.5" fill="#38bdf8" opacity="0.8" stroke="#7dd3fc" stroke-width="0.5"/>
  <rect x="677" y="155" width="11" height="8" rx="1.5" fill="#38bdf8" opacity="0.8" stroke="#7dd3fc" stroke-width="0.5"/>
  <rect x="693" y="155" width="9" height="8" rx="1.5" fill="#38bdf8" opacity="0.8" stroke="#7dd3fc" stroke-width="0.5"/>

  <!-- Funnel (blue/white - Maersk style) -->
  <rect x="650" y="112" width="28" height="42" rx="3" fill="#003d8f"/>
  <rect x="650" y="112" width="28" height="10" rx="2" fill="#0052bf"/>
  <rect x="654" y="125" width="20" height="8" fill="#ffffff" opacity="0.9"/>
  <!-- Star on funnel -->
  <circle cx="664" cy="129" r="3" fill="#003d8f"/>
  <!-- Smoke -->
  <ellipse cx="664" cy="105" rx="8" ry="5" fill="#9ca3af" opacity="0.5"/>
  <ellipse cx="668" cy="93" rx="11" ry="7" fill="#d1d5db" opacity="0.35"/>
  <ellipse cx="673" cy="78" rx="15" ry="10" fill="#f3f4f6" opacity="0.2"/>

  <!-- Main mast -->
  <line x1="652" y1="150" x2="652" y2="100" stroke="#374151" stroke-width="3"/>
  <line x1="638" y1="115" x2="666" y2="115" stroke="#374151" stroke-width="2"/>
  <!-- Radar -->
  <ellipse cx="652" cy="100" rx="6" ry="3" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Navigation lights -->
  <circle cx="652" cy="100" r="3" fill="#fbbf24" opacity="0.9" filter="url(#glow)"/>
  <circle cx="698" cy="152" r="2.5" fill="#ffffff" opacity="0.9"/>
  <!-- Port/starboard -->
  <circle cx="55" cy="252" r="3.5" fill="#ef4444" opacity="0.95" filter="url(#glow)"/>

  <!-- Label -->
  <text x="300" y="277" text-anchor="middle" font-family="monospace" font-size="9" fill="#60a5fa" opacity="0.6">CONTAINER SHIP</text>
</svg>
