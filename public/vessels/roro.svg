<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2040"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Sunset sky -->
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="130" cy="205" r="35" fill="#fbbf24" opacity="0.9" filter="url(#glow)"/>
  <circle cx="130" cy="205" r="28" fill="#fde68a" opacity="0.7"/>

  <!-- Sun rays -->
  <ellipse cx="130" cy="190" rx="3" ry="20" fill="#fbbf24" opacity="0.3" transform="rotate(-20 130 205)"/>
  <ellipse cx="130" cy="190" rx="3" ry="20" fill="#fbbf24" opacity="0.3" transform="rotate(20 130 205)"/>
  <ellipse cx="130" cy="190" rx="3" ry="22" fill="#fbbf24" opacity="0.25" transform="rotate(60 130 205)"/>
  <ellipse cx="130" cy="190" rx="3" ry="22" fill="#fbbf24" opacity="0.25" transform="rotate(-60 130 205)"/>

  <!-- Horizon clouds -->
  <ellipse cx="380" cy="165" rx="120" ry="28" fill="#f97316" opacity="0.2"/>
  <ellipse cx="600" cy="140" rx="90" ry="22" fill="#dc2626" opacity="0.15"/>
  <ellipse cx="700" cy="155" rx="70" ry="18" fill="#b45309" opacity="0.2"/>

  <!-- Ocean -->
  <rect x="0" y="218" width="800" height="182" fill="url(#sea)"/>

  <!-- Sun on water -->
  <ellipse cx="130" cy="235" rx="100" ry="15" fill="#fbbf24" opacity="0.18"/>
  <rect x="115" y="220" width="30" height="60" fill="#fbbf24" opacity="0.06"/>

  <!-- Ocean waves (sunset orange tint) -->
  <path d="M 0 228 Q 50 224 100 228 Q 150 232 200 228 Q 250 224 300 228 Q 350 232 400 228 Q 450 224 500 228 Q 550 232 600 228 Q 650 224 700 228 Q 750 232 800 228" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.3"/>
  <path d="M 0 242 Q 60 238 120 242 Q 180 246 240 242 Q 300 238 360 242 Q 420 246 480 242 Q 540 238 600 242 Q 660 246 720 242 Q 760 238 800 242" fill="none" stroke="#ea580c" stroke-width="1" opacity="0.2"/>

  <!-- === RO-RO FERRY / VEHICLE CARRIER === -->
  <!-- Hull (tall, box-shaped) -->
  <path d="M 62 248 L 738 248 L 758 263 L 745 285 L 55 285 L 42 270 Z" fill="url(#hull)" filter="url(#shadow)"/>

  <!-- Waterline stripe (white) -->
  <rect x="60" y="244" width="678" height="7" fill="#ffffff" rx="1" opacity="0.9"/>
  <rect x="60" y="251" width="678" height="3" fill="#dbeafe"/>

  <!-- Main vehicle deck body (tall) -->
  <rect x="64" y="168" width="672" height="80" fill="#1e3a8a"/>
  <rect x="64" y="168" width="672" height="5" fill="#2563eb" opacity="0.5"/>

  <!-- Deck levels (horizontal lines) -->
  <line x1="64" y1="195" x2="736" y2="195" stroke="#2563eb" stroke-width="1" opacity="0.4"/>
  <line x1="64" y1="220" x2="736" y2="220" stroke="#2563eb" stroke-width="1" opacity="0.4"/>

  <!-- Porthole windows (row) -->
  <circle cx="110" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="140" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="170" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="200" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="230" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="260" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="290" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="320" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="350" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="380" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="410" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="440" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="470" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="500" cy="182" r="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>

  <!-- Second row portholes -->
  <circle cx="110" cy="208" r="5" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="140" cy="208" r="5" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="200" cy="208" r="5" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="260" cy="208" r="5" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="320" cy="208" r="5" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="380" cy="208" r="5" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="440" cy="208" r="5" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="500" cy="208" r="5" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Stern ramp -->
  <rect x="62" y="230" width="18" height="20" rx="1" fill="#1e40af" stroke="#3b82f6" stroke-width="1"/>

  <!-- Superstructure / bridge (forward upper) -->
  <rect x="530" y="120" width="180" height="55" rx="3" fill="#1e40af"/>
  <rect x="530" y="120" width="180" height="6" fill="#3b82f6" opacity="0.6"/>

  <!-- Funnel pair -->
  <rect x="610" y="75" width="24" height="50" rx="3" fill="#1e40af"/>
  <rect x="640" y="78" width="24" height="47" rx="3" fill="#1e40af"/>
  <rect x="610" y="75" width="24" height="10" rx="2" fill="#3b82f6"/>
  <rect x="640" y="78" width="24" height="10" rx="2" fill="#3b82f6"/>
  <!-- Smoke -->
  <ellipse cx="620" cy="68" rx="9" ry="6" fill="#9ca3af" opacity="0.5"/>
  <ellipse cx="652" cy="70" rx="9" ry="6" fill="#9ca3af" opacity="0.45"/>
  <ellipse cx="636" cy="55" rx="14" ry="9" fill="#d1d5db" opacity="0.3"/>

  <!-- Bridge windows -->
  <rect x="540" y="128" width="12" height="10" rx="2" fill="#fbbf24" opacity="0.7" stroke="#fde68a" stroke-width="0.5"/>
  <rect x="558" y="128" width="12" height="10" rx="2" fill="#fbbf24" opacity="0.7" stroke="#fde68a" stroke-width="0.5"/>
  <rect x="576" y="128" width="12" height="10" rx="2" fill="#fbbf24" opacity="0.7" stroke="#fde68a" stroke-width="0.5"/>
  <rect x="594" y="128" width="12" height="10" rx="2" fill="#fbbf24" opacity="0.7" stroke="#fde68a" stroke-width="0.5"/>

  <!-- Nav lights -->
  <circle cx="636" cy="75" r="3" fill="#fbbf24" opacity="0.95" filter="url(#glow)"/>

  <!-- Label -->
  <text x="300" y="277" text-anchor="middle" font-family="monospace" font-size="9" fill="#93c5fd" opacity="0.6">RO-RO VESSEL</text>
</svg>
