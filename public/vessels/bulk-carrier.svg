<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c3a5e"/>
      <stop offset="60%" stop-color="#1a6699"/>
      <stop offset="100%" stop-color="#2a8ab8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d4f70"/>
      <stop offset="100%" stop-color="#072d45"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#922b21"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- Horizon haze -->
  <ellipse cx="400" cy="220" rx="500" ry="60" fill="#1a7ab0" opacity="0.3"/>

  <!-- Distant coastline suggestion -->
  <path d="M 0 215 Q 100 205 200 212 Q 300 218 400 210 Q 500 202 600 208 Q 700 215 800 210 L 800 225 L 0 225 Z" fill="#0d3d5a" opacity="0.5"/>

  <!-- Sun reflection on water -->
  <ellipse cx="650" cy="240" rx="80" ry="12" fill="#fbbf24" opacity="0.15"/>

  <!-- Ocean -->
  <rect x="0" y="220" width="800" height="180" fill="url(#sea)"/>

  <!-- Ocean waves -->
  <path d="M 0 230 Q 50 225 100 230 Q 150 235 200 230 Q 250 225 300 230 Q 350 235 400 230 Q 450 225 500 230 Q 550 235 600 230 Q 650 225 700 230 Q 750 235 800 230" fill="none" stroke="#2a8ab8" stroke-width="1.5" opacity="0.5"/>
  <path d="M 0 245 Q 60 240 120 245 Q 180 250 240 245 Q 300 240 360 245 Q 420 250 480 245 Q 540 240 600 245 Q 660 250 720 245 Q 760 240 800 245" fill="none" stroke="#1e6b8a" stroke-width="1" opacity="0.4"/>
  <path d="M 0 260 Q 80 255 160 260 Q 240 265 320 260 Q 400 255 480 260 Q 560 265 640 260 Q 720 255 800 260" fill="none" stroke="#1a5a78" stroke-width="1" opacity="0.3"/>

  <!-- Wake -->
  <path d="M 100 270 Q 200 265 300 262 Q 350 260 400 258" fill="none" stroke="#4db6e4" stroke-width="2" opacity="0.3"/>
  <path d="M 80 278 Q 200 272 320 268 Q 370 266 400 264" fill="none" stroke="#3aa0cc" stroke-width="1.5" opacity="0.2"/>

  <!-- === BULK CARRIER === -->
  <!-- Hull -->
  <path d="M 80 258 L 720 258 L 745 270 L 730 285 L 70 285 L 55 270 Z" fill="url(#hull)" filter="url(#shadow)"/>

  <!-- Waterline stripe -->
  <rect x="75" y="254" width="645" height="6" fill="#e74c3c" rx="2"/>
  <rect x="75" y="260" width="645" height="3" fill="#c0392b"/>

  <!-- Main deck -->
  <rect x="80" y="220" width="640" height="38" fill="#5a6475" rx="2"/>
  <rect x="80" y="220" width="640" height="4" fill="#7f8c9d"/>

  <!-- Hatch covers (bulk carrier characteristic) -->
  <rect x="100" y="225" width="90" height="28" rx="3" fill="#4a5568" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="105" y="230" width="80" height="18" rx="2" fill="#374151"/>
  <line x1="150" y1="225" x2="150" y2="253" stroke="#6b7280" stroke-width="1"/>

  <rect x="205" y="225" width="90" height="28" rx="3" fill="#4a5568" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="210" y="230" width="80" height="18" rx="2" fill="#374151"/>
  <line x1="250" y1="225" x2="250" y2="253" stroke="#6b7280" stroke-width="1"/>

  <rect x="310" y="225" width="90" height="28" rx="3" fill="#4a5568" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="315" y="230" width="80" height="18" rx="2" fill="#374151"/>
  <line x1="355" y1="225" x2="355" y2="253" stroke="#6b7280" stroke-width="1"/>

  <rect x="415" y="225" width="90" height="28" rx="3" fill="#4a5568" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="420" y="230" width="80" height="18" rx="2" fill="#374151"/>
  <line x1="460" y1="225" x2="460" y2="253" stroke="#6b7280" stroke-width="1"/>

  <rect x="520" y="225" width="80" height="28" rx="3" fill="#4a5568" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="525" y="230" width="70" height="18" rx="2" fill="#374151"/>

  <!-- Superstructure (aft) -->
  <rect x="610" y="185" width="100" height="38" rx="3" fill="#8395a7"/>
  <rect x="610" y="185" width="100" height="6" rx="2" fill="#95a5b8"/>

  <!-- Bridge wings -->
  <rect x="600" y="190" width="10" height="25" fill="#7f8ea0"/>
  <rect x="710" y="190" width="10" height="25" fill="#7f8ea0"/>

  <!-- Bridge windows -->
  <rect x="618" y="193" width="12" height="10" rx="2" fill="#2c3e50" stroke="#4a90b8" stroke-width="1"/>
  <rect x="636" y="193" width="12" height="10" rx="2" fill="#2c3e50" stroke="#4a90b8" stroke-width="1"/>
  <rect x="654" y="193" width="12" height="10" rx="2" fill="#2c3e50" stroke="#4a90b8" stroke-width="1"/>
  <rect x="672" y="193" width="12" height="10" rx="2" fill="#2c3e50" stroke="#4a90b8" stroke-width="1"/>
  <rect x="690" y="193" width="12" height="10" rx="2" fill="#2c3e50" stroke="#4a90b8" stroke-width="1"/>

  <!-- Funnel -->
  <rect x="650" y="155" width="30" height="35" rx="4" fill="#c0392b"/>
  <rect x="650" y="155" width="30" height="8" rx="2" fill="#e74c3c"/>
  <!-- Funnel smoke -->
  <ellipse cx="665" cy="148" rx="8" ry="5" fill="#9ca3af" opacity="0.6"/>
  <ellipse cx="668" cy="138" rx="10" ry="6" fill="#9ca3af" opacity="0.4"/>
  <ellipse cx="672" cy="125" rx="13" ry="8" fill="#d1d5db" opacity="0.25"/>

  <!-- Mast -->
  <line x1="660" y1="155" x2="660" y2="120" stroke="#6b7280" stroke-width="3"/>
  <line x1="645" y1="130" x2="675" y2="130" stroke="#6b7280" stroke-width="2"/>
  <!-- Radar -->
  <circle cx="660" cy="120" r="4" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Bow anchor chain holes -->
  <circle cx="100" cy="270" r="4" fill="#374151"/>
  <circle cx="115" cy="272" r="3" fill="#374151"/>

  <!-- Deck equipment -->
  <rect x="610" y="218" width="15" height="5" rx="2" fill="#6b7280"/>
  <rect x="630" y="217" width="15" height="7" rx="2" fill="#6b7280"/>

  <!-- Navigation lights -->
  <circle cx="680" cy="188" r="2.5" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>

  <!-- IMO label area -->
  <text x="350" y="276" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb" opacity="0.7">BULK CARRIER</text>
</svg>
